server:
  port: 8081

spring:
  application:
    name: measurement-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true   # Required for Feign fallbacks to work

jwt:
  secret: ThisIsASecretKeyForJWTQuantityMeasurementApp2024
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
